[package]
name = "usage-guard-tray"
version = "0.1.0"
description = "Tray app for Usage Guard: daily budget per lane, routing choice and pause"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
