<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Guard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">usage guard<b>.</b></div>
    <label class="pause"><input type="checkbox" id="enabled" role="switch"> <strong id="enabled-label">On</strong></label>
  </header>
  <main>
    <p class="off" id="off" hidden>Usage Guard is off: no hooks, alerts or routing. Turn it on with the switch above.</p>
    <label class="pause"><input type="checkbox" id="pause"> Pause routing</label>
    <p class="error" id="error" role="alert" hidden></p>
    <section id="lanes" aria-live="polite"></section>
    <section class="route">
      <h2>Next job goes to</h2>
      <div class="choice"><strong id="route-lane">…</strong><p id="route-reason"></p></div>
    </section>
    <section>
      <h2>Recent decisions</h2>
      <ol id="decisions" class="decisions"></ol>
    </section>
    <section class="banked">
      <button type="button" id="banked">Codex banked reset…</button>
      <p>Usage Guard never spends this. The button opens Codex's usage page so you can choose to.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
